<style>
  .stock-container-box *, .stock-modal-overlay * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  .stock-container-box label { font-size: 12px; font-weight: 700; color: #334155; display: block; margin-top: 10px; text-align: left; text-transform: uppercase; }
  .stock-container-box input { width: 100%; padding: 12px 14px; margin-top: 5px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 16px; background: #f8fafc; color: #1e293b; outline: none; }
  .stock-container-box input:focus { border-color: #3b82f6; background: #fff; }
  .stock-btn-accion { background: #0f172a; color: white; border: none; padding: 13px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 1rem; margin-top: 14px; cursor: pointer; }
  .stock-btn-cancelar { background: #64748b; color: white; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 0.85rem; margin-top: 8px; cursor: pointer; display: none; }
  .stock-btn-registros { background: #475569; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 1rem; margin-top: 8px; cursor: pointer; }
  .stock-btn-secundario { background: #334155; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 0.95rem; margin-top: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  .stock-btn-calc-link { background: #3b82f6; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
  
  .stock-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 12px; }
  .stock-modal-overlay.active { display: flex; }
  .stock-modal-container { background: white; width: 100%; max-width: 380px; border-radius: 16px; padding: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); max-height: 85vh; display: flex; flex-direction: column; overflow-y: auto; }
  .stock-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; flex-shrink: 0; }
  .stock-lista-modal { margin-top: 8px; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .stock-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 0.9rem; }
  
  .calc-row { display: flex; gap: 6px; margin-top: 5px; align-items: center; width: 100%; }
  .calc-row input { min-width: 0; width: 100%; margin-top: 0; padding: 8px 10px; font-size: 14px; }
</style>

<div class="stock-container-box">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1.5px solid #e2e8f0; padding-bottom: 2px;">
    <div style="display: flex; flex-direction: column; justify-content: space-between; height: 44px;">
      <h3 style="font-size: 1.05rem; color: #0f172a; font-weight: 800; margin: 0; line-height: 1;">📦 Control de Stock</h3>
      <div id="lblFechaTrabajoStock" style="font-size: 0.80rem; color: #64748b; font-weight: 700; line-height: 1;">Fecha de Trabajo: -</div>
    </div>
    
    <button onclick="cerrarVentanaModalStockGen()" title="Volver al Menú" style="background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;">
      <img src="icono.png" alt="Logo SBO" style="width: 44px; height: 44px; object-fit: contain;">
    </button>
  </div>

  <label>Nombre del Producto / Artículo:</label>
  <input type="text" id="txtProducto" placeholder="Ej: Denario, Pulsera Corazón...">

  <label>Cantidad:</label>
  <input type="number" id="txtCantidad" placeholder="0" min="1" step="1">

  <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px;">
    <label style="margin-top:0;">Precio de Venta ($):</label>
    <button type="button" class="stock-btn-calc-link" onclick="abrirCalculadoraStock()">🧮 Calcular Precio</button>
  </div>
  <input type="number" id="txtPrecio" placeholder="0.00" step="0.01">

  <button class="stock-btn-accion" id="btnAccionStock" onclick="guardarProductoStock()">➕ Agregar al Stock</button>
  <button class="stock-btn-cancelar" id="btnCancelarStock" onclick="cancelarEdicionStock()">Cancelar Edición</button>
  
  <button class="stock-btn-registros" id="btnAbrirModalStock">📋 Ver Inventario Actual</button>
  <button onclick="cerrarVentanaModalStockGen()" class="stock-btn-secundario">Volver al Menú</button>
</div>

<!-- Modal Inventario Actual -->
<div class="stock-modal-overlay" id="modal-stock-actual">
  <div class="stock-modal-container">
    <div class="stock-modal-header">
      <h3 style="font-size: 1rem; color: #0f172a; font-weight: 700; margin: 0;">📋 Inventario Actual</h3>
      <button id="btnCerrarModalStockX" style="background: none; color: #64748b; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer;">✕</button>
    </div>

    <div id="listaStock" class="stock-lista-modal">
      <div style="text-align: center; color: #94a3b8; font-size: 0.85rem; padding: 15px;">No hay productos en stock.</div>
    </div>

    <button class="stock-btn-secundario" style="margin-top: 10px;" onclick="window.print()">
      🖨️ Imprimir / Guardar Inventario
    </button>
  </div>
</div>

<!-- MODAL CALCULADORA DE COSTOS -->
<div id="modalCalculadoraStock" class="stock-modal-overlay">
  <div class="stock-modal-container">
    <h3 style="margin: 0 0 2px; font-size: 1.05rem; color: #0f172a;">🧮 Calculadora de Costos</h3>
    <p style="font-size: 0.72rem; color: #64748b; margin: 0 0 8px;">Insumos, valor hora y tiempo de elaboración.</p>

    <label style="font-weight: bold; color: #334155; font-size: 11px; margin-top: 4px;">Materia Prima e Insumos:</label>
    
    <div class="calc-row">
      <input type="text" id="mat1_desc" placeholder="Material 1" style="flex: 2;">
      <input type="number" id="mat1_val" placeholder="$ Costo" step="0.01" style="flex: 1;" oninput="calcularTotalModalStock()">
    </div>
    <div class="calc-row">
      <input type="text" id="mat2_desc" placeholder="Material 2" style="flex: 2;">
      <input type="number" id="mat2_val" placeholder="$ Costo" step="0.01" style="flex: 1;" oninput="calcularTotalModalStock()">
    </div>
    <div class="calc-row">
      <input type="text" id="mat3_desc" placeholder="Material 3" style="flex: 2;">
      <input type="number" id="mat3_val" placeholder="$ Costo" step="0.01" style="flex: 1;" oninput="calcularTotalModalStock()">
    </div>
    <div class="calc-row">
      <input type="text" id="mat4_desc" placeholder="Material 4" style="flex: 2;">
      <input type="number" id="mat4_val" placeholder="$ Costo" step="0.01" style="flex: 1;" oninput="calcularTotalModalStock()">
    </div>

    <label style="font-weight: bold; color: #334155; margin-top: 8px; font-size: 11px;">Mano de Obra:</label>
    <div class="calc-row">
      <div style="flex: 1; min-width: 0;">
        <label style="font-size: 9px; margin-top: 0;">Valor Hora ($):</label>
        <input type="number" id="calcValorHora" value="10000" placeholder="0.00" step="100" oninput="calcularTotalModalStock()">
      </div>
      <div style="flex: 1; min-width: 0;">
        <label style="font-size: 9px; margin-top: 0;">Minutos:</label>
        <input type="number" id="calcMinutos" placeholder="Ej: 25" step="1" oninput="calcularTotalModalStock()">
      </div>
    </div>
    <div style="font-size: 0.75rem; color: #64748b; margin-top: 4px; text-align: right;">
      Costo tiempo: $<span id="lblCostoManoObra">0.00</span>
    </div>

    <label style="font-weight: bold; color: #334155; margin-top: 6px; font-size: 11px;">Margen de Ganancia:</label>
    <div class="calc-row">
      <input type="number" id="calcGanancia" placeholder="Ej: 50" value="50" step="1" style="flex: 1;" oninput="calcularTotalModalStock()">
      <span style="font-size: 0.9rem; font-weight: bold; color: #4b5563;">%</span>
    </div>

    <div style="background: #f1f5f9; padding: 10px; border-radius: 10px; margin-top: 10px; text-align: right;">
      <div style="font-size: 0.75rem; color: #64748b;">Costo Total: $<span id="lblCostoTotal">0.00</span></div>
      <div style="font-size: 1.05rem; font-weight: 800; color: #0f172a; margin-top: 2px;">Precio Sugerido: $<span id="lblPrecioFinal">0.00</span></div>
    </div>

    <button class="stock-btn-accion" style="margin-top: 10px;" onclick="aplicarPrecioCalculadoStock()">✅ Usar este Precio</button>
    <button class="stock-btn-secundario" style="background: #64748b; margin-top: 8px;" onclick="cerrarCalculadoraStock()">❌ Cerrar</button>
  </div>
</div>

<script>
  function cerrarVentanaModalStockGen() {
    if (typeof cerrarModalDinamico === 'function') {
      cerrarModalDinamico();
    } else {
      window.location.href = 'menu.html';
    }
  }

  var fechaSesionStock = localStorage.getItem('bma_fechaSesion') || localStorage.getItem('sbo_fechaSesion') || new Date().toISOString().split('T')[0];

  function formatearFechaStock(fechaStr) {
    if (!fechaStr) return '';
    var partes = fechaStr.split('-');
    return partes.length === 3 ? partes[2] + '/' + partes[1] + '/' + partes[0] : fechaStr;
  }

  var lblFechaStockEl = document.getElementById('lblFechaTrabajoStock');
  if (lblFechaStockEl) {
    lblFechaStockEl.innerText = 'Fecha de Trabajo: ' + formatearFechaStock(fechaSesionStock);
  }

  var inventarioStock = [];
  var editandoIndexStock = null;

  try {
    var guardadosStock = localStorage.getItem('bma_stock') || localStorage.getItem('sbo_stock');
    if (guardadosStock) inventarioStock = JSON.parse(guardadosStock);
  } catch (e) {
    inventarioStock = [];
  }

  function actualizarPantallaStock() {
    var listaContainer = document.getElementById('listaStock');
    if (!listaContainer) return;
    listaContainer.innerHTML = '';

    if (inventarioStock.length === 0) {
      listaContainer.innerHTML = '<div style="text-align: center; color: #94a3b8; font-size: 0.85rem; padding: 15px;">No hay productos en stock.</div>';
    } else {
      for (var i = 0; i < inventarioStock.length; i++) {
        var p = inventarioStock[i];
        var item = document.createElement('div');
        item.className = 'stock-item';
        item.innerHTML = 
          '<div style="display: flex; flex-direction: column; gap: 3px;">' +
            '<span style="font-weight: bold; color: #1e293b; font-size: 0.95rem;">' + p.producto + '</span>' +
            '<span style="font-size: 0.8rem; color: #64748b;">Precio: $' + Number(p.precio || 0).toFixed(2) + '</span>' +
          '</div>' +
          '<div style="display: flex; align-items: center; gap: 8px;">' +
            '<span style="font-weight: bold; font-size: 0.95rem; color: #0f172a;">' + p.cantidad + ' un.</span>' +
            '<div style="display:flex; gap:4px;">' +
              '<button style="background: none; border: none; color: #3b82f6; font-size: 1.1rem; cursor: pointer; padding: 4px;" onclick="cargarParaEditarStock(' + i + ')" title="Editar">✏️</button>' +
              '<button style="background: none; border: none; color: #ef4444; font-size: 1.1rem; cursor: pointer; padding: 4px;" onclick="eliminarProductoStock(' + i + ')" title="Eliminar">❌</button>' +
            '</div>' +
          '</div>';
        listaContainer.appendChild(item);
      }
    }
  }

  function guardarProductoStock() {
    var producto = document.getElementById('txtProducto').value.trim();
    var cantidad = parseInt(document.getElementById('txtCantidad').value);
    var precio = parseFloat(document.getElementById('txtPrecio').value) || 0;

    if (!producto) {
      alert('Por favor, ingresá el nombre del producto.');
      return;
    }
    if (isNaN(cantidad) || cantidad <= 0) {
      alert('Por favor, ingresá una cantidad válida.');
      return;
    }

    if (editandoIndexStock !== null) {
      inventarioStock[editandoIndexStock] = { 
        producto: producto, 
        cantidad: cantidad, 
        precio: precio, 
        fecha: inventarioStock[editandoIndexStock].fecha || fechaSesionStock 
      };
      cancelarEdicionStock();
    } else {
      inventarioStock.push({ producto: producto, cantidad: cantidad, precio: precio, fecha: fechaSesionStock });
      limpiarFormularioStock();
    }

    guardarYActualizarStock();
  }

  function cargarParaEditarStock(index) {
    var p = inventarioStock[index];
    document.getElementById('txtProducto').value = p.producto;
    document.getElementById('txtCantidad').value = p.cantidad;
    document.getElementById('txtPrecio').value = p.precio;

    editandoIndexStock = index;
    var btnAccion = document.getElementById('btnAccionStock');
    if (btnAccion) {
      btnAccion.innerText = '💾 Actualizar Producto';
      btnAccion.style.background = '#3b82f6';
    }
    var btnCancel = document.getElementById('btnCancelarStock');
    if (btnCancel) btnCancel.style.display = 'block';
    
    var modalStockActual = document.getElementById('modal-stock-actual');
    if (modalStockActual) modalStockActual.classList.remove('active');
  }

  function cancelarEdicionStock() {
    editandoIndexStock = null;
    var btnAccion = document.getElementById('btnAccionStock');
    if (btnAccion) {
      btnAccion.innerText = '➕ Agregar al Stock';
      btnAccion.style.background = '#0f172a';
    }
    var btnCancel = document.getElementById('btnCancelarStock');
    if (btnCancel) btnCancel.style.display = 'none';
    limpiarFormularioStock();
  }

  function limpiarFormularioStock() {
    document.getElementById('txtProducto').value = '';
    document.getElementById('txtCantidad').value = '';
    document.getElementById('txtPrecio').value = '';
  }

  function eliminarProductoStock(index) {
    if (confirm('¿Querés eliminar este producto del stock?')) {
      if (editandoIndexStock === index) {
        cancelarEdicionStock();
      } else if (editandoIndexStock !== null && editandoIndexStock > index) {
        editandoIndexStock--; 
      }
      inventarioStock.splice(index, 1);
      guardarYActualizarStock();
    }
  }

  function guardarYActualizarStock() {
    localStorage.setItem('bma_stock', JSON.stringify(inventarioStock));
    actualizarPantallaStock();
  }

  function abrirCalculadoraStock() {
    var modalCalc = document.getElementById('modalCalculadoraStock');
    if (modalCalc) modalCalc.classList.add('active');
    calcularTotalModalStock();
  }

  function cerrarCalculadoraStock() {
    var modalCalc = document.getElementById('modalCalculadoraStock');
    if (modalCalc) modalCalc.classList.remove('active');
    resetearCalculadoraStock();
  }

  function resetearCalculadoraStock() {
    var ids = ['mat1_desc', 'mat1_val', 'mat2_desc', 'mat2_val', 'mat3_desc', 'mat3_val', 'mat4_desc', 'mat4_val', 'calcMinutos'];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (el) el.value = '';
    }
    var vh = document.getElementById('calcValorHora'); if (vh) vh.value = '10000';
    var cg = document.getElementById('calcGanancia'); if (cg) cg.value = '50';

    var lbls = ['lblCostoManoObra', 'lblCostoTotal', 'lblPrecioFinal'];
    for (var j = 0; j < lbls.length; j++) {
      var elLbl = document.getElementById(lbls[j]);
      if (elLbl) elLbl.innerText = '0.00';
    }
  }

  function calcularTotalModalStock() {
    var m1 = parseFloat(document.getElementById('mat1_val').value) || 0;
    var m2 = parseFloat(document.getElementById('mat2_val').value) || 0;
    var m3 = parseFloat(document.getElementById('mat3_val').value) || 0;
    var m4 = parseFloat(document.getElementById('mat4_val').value) || 0;

    var valorHora = parseFloat(document.getElementById('calcValorHora').value) || 0;
    var minutos = parseFloat(document.getElementById('calcMinutos').value) || 0;
    
    var costoManoObra = (minutos / 60) * valorHora;
    var gananciaPct = parseFloat(document.getElementById('calcGanancia').value) || 0;

    var costoTotalInsumos = m1 + m2 + m3 + m4;
    var costoTotal = costoTotalInsumos + costoManoObra;
    var precioFinal = costoTotal * (1 + (gananciaPct / 100));

    var lblCMO = document.getElementById('lblCostoManoObra'); if (lblCMO) lblCMO.innerText = costoManoObra.toFixed(2);
    var lblCT = document.getElementById('lblCostoTotal'); if (lblCT) lblCT.innerText = costoTotal.toFixed(2);
    var lblPF = document.getElementById('lblPrecioFinal'); if (lblPF) lblPF.innerText = precioFinal.toFixed(2);
  }

  function aplicarPrecioCalculadoStock() {
    var lblPF = document.getElementById('lblPrecioFinal');
    var precioFinal = lblPF ? lblPF.innerText : '0.00';
    var txtPrecio = document.getElementById('txtPrecio');
    if (txtPrecio) txtPrecio.value = precioFinal;
    var modalCalc = document.getElementById('modalCalculadoraStock');
    if (modalCalc) modalCalc.classList.remove('active');
    resetearCalculadoraStock();
  }

  var modalStockActual = document.getElementById('modal-stock-actual');
  var btnAbrirStock = document.getElementById('btnAbrirModalStock');
  var btnCerrarStockX = document.getElementById('btnCerrarModalStockX');

  if (btnAbrirStock && modalStockActual) {
    btnAbrirStock.onclick = function() { modalStockActual.classList.add('active'); };
  }
  if (btnCerrarStockX && modalStockActual) {
    btnCerrarStockX.onclick = function() { modalStockActual.classList.remove('active'); };
  }
  if (modalStockActual) {
    modalStockActual.onclick = function(e) {
      if (e.target === modalStockActual) modalStockActual.classList.remove('active');
    };
  }

  actualizarPantallaStock();
</script>
