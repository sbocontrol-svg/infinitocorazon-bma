<style>
  .stock-container-box *, .stock-modal-overlay * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  .stock-container-box label { font-size: 14px; font-weight: 700; color: #334155; display: block; margin-top: 10px; text-align: left; text-transform: uppercase; }
  
  .stock-container-box input, .stock-modal-container input { 
    width: 100%; 
    padding: 12px 14px; 
    margin-top: 5px; 
    border: 1.5px solid #d9381e; 
    border-radius: 10px; 
    font-size: 14px; 
    background: #f8fafc; 
    color: #1e293b; 
    outline: none; 
  }
  .stock-container-box input:focus, .stock-modal-container input:focus { 
    border-color: #d9381e; 
    background: #fff; 
    box-shadow: 0 0 0 2px rgba(217, 56, 30, 0.15);
  }
  
  .stock-btn-accion { background: #f1f5f9; color: #0f172a; border: 1.5px solid #cbd5e1; padding: 13px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 1rem; margin-top: 14px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
  .stock-btn-cancelar { background: #dc2626; color: white; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 0.85rem; margin-top: 8px; cursor: pointer; display: none; }
  .stock-btn-registros { background: #475569; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 1rem; margin-top: 8px; cursor: pointer; }
  .stock-btn-print { background: #64748b; color: white; border: none; padding: 11px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 0.9rem; margin-top: 10px; cursor: pointer; box-shadow: 0 2px 8px rgba(100,116,139,0.3); }
  .stock-btn-secundario { background: #0f172a; color: #d9381e; border: 1.5px solid #d9381e; padding: 12px; width: 100%; border-radius: 10px; font-weight: 800; font-size: 0.95rem; margin-top: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  
  .stock-btn-calc-link { 
    background: rgba(100, 116, 139, 0.22); 
    color: #1e293b; 
    border: 1.5px solid #d9381e; 
    padding: 6px 12px; 
    border-radius: 8px; 
    font-size: 14px; 
    font-weight: bold; 
    cursor: pointer; 
    backdrop-filter: blur(4px);
    box-shadow: 0 2px 8px rgba(100, 116, 139, 0.2);
  }
  
  .stock-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 12px; }
  .stock-modal-overlay.active { display: flex; }
  .stock-modal-container { background: white; width: 100%; max-width: 380px; border-radius: 16px; padding: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); max-height: 85vh; display: flex; flex-direction: column; overflow-y: auto; }
  
  #modalCalculadoraStock .stock-modal-container {
    max-width: 440px;
    width: 96%;
    padding: 20px;
  }

  .stock-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; flex-shrink: 0; }
  .stock-lista-modal { margin-top: 8px; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .stock-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; }
  
  .calc-row { display: flex; gap: 6px; margin-top: 5px; align-items: center; width: 100%; }
  .calc-row input { min-width: 0; width: 100%; margin-top: 0; padding: 8px 10px; font-size: 14px; border: 1.5px solid #cbd5e1; background: #f8fafc; color: #1e293b; border-radius: 8px; }
  .calc-row input:focus { border-color: #d9381e; background: #fff; box-shadow: 0 0 0 2px rgba(217, 56, 30, 0.15); }
</style>

<div class="stock-container-box">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1.5px solid #e2e8f0; padding-bottom: 6px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h3 id="lblTituloStockForm" style="font-size: 1.60rem; color: #d9381e; font-weight: 800; margin: 0; line-height: 1.1; font-family: 'Segoe Script', cursive;">Agregar Productos</h3>
      <div class="lblFechaTrabajoStock" style="font-size: 14px; color: #64748b; font-weight: 700; line-height: 1.2;">Fecha de Trabajo: -</div>
    </div>
    
    <button onclick="window.cerrarVentanaModalStockGen()" title="Volver al Menú" style="background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;">
      <img src="icono.png" alt="Logo BMA" style="width: 44px; height: 44px; object-fit: contain;">
    </button>
  </div>

  <label>Nombre del Producto / Artículo:</label>
  <input type="text" id="txtProducto" placeholder="Ej: Denario, Pulsera Corazón...">

  <label>Cantidad:</label>
  <input type="number" id="txtCantidad" placeholder="0" min="1" step="1">

  <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px;">
    <label style="margin-top:0;">Precio de Venta ($):</label>
    <button type="button" class="stock-btn-calc-link" onclick="window.abrirCalculadoraStock()">Calcular Precio</button>
  </div>
  <input type="number" id="txtPrecio" placeholder="0.00" step="0.01">

  <button class="stock-btn-accion" id="btnAccionStock" onclick="window.guardarProductoStock()">Agregar Productos</button>
  <button class="stock-btn-cancelar" id="btnCancelarStock" onclick="window.cancelarEdicionStock()">Cancelar Edición</button>
  
  <button class="stock-btn-registros" id="btnAbrirModalStock">Mostrar Registros (0)</button>
  <button onclick="window.cerrarVentanaModalStockGen()" class="stock-btn-secundario">Volver al Menú</button>
</div>

<!-- Modal Inventario / Mostrar Productos -->
<div class="stock-modal-overlay" id="modal-stock-actual">
  <div class="stock-modal-container">
    <div class="stock-modal-header">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h3 style="font-size: 1.60rem; color: #d9381e; font-weight: 800; margin: 0; font-family: 'Segoe Script', cursive; line-height: 1.1;">Mostrar Productos</h3>
        <div class="lblFechaTrabajoStock" style="font-size: 14px; color: #64748b; font-weight: 700; line-height: 1.2;">Fecha de Trabajo: -</div>
      </div>
      <button onclick="window.cerrarModalStockActual()" title="Volver al Formulario" style="background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;">
        <img src="icono.png" alt="Logo BMA" style="width: 44px; height: 44px; object-fit: contain;">
      </button>
    </div>

    <div style="margin-bottom: 4px;">
      <label style="margin-top: 0; font-size: 14px; font-weight: 700; color: #475569;">Buscar Producto:</label>
      <input type="text" id="txtBuscarStock" placeholder="Buscar por nombre..." oninput="window.actualizarPantallaStock()">
    </div>

    <div id="listaStock" class="stock-lista-modal">
      <div style="text-align: center; color: #94a3b8; font-size: 14px; padding: 15px;">No hay productos en stock.</div>
    </div>

    <button class="stock-btn-print" onclick="window.imprimirStock()">
      Imprimir / Guardar PDF
    </button>
    <button class="stock-btn-registros" onclick="window.cerrarModalStockActual()" style="margin-top: 8px;">
      Volver al Formulario
    </button>
  </div>
</div>

<!-- MODAL CALCULADORA DE COSTOS -->
<div id="modalCalculadoraStock" class="stock-modal-overlay">
  <div class="stock-modal-container">
    <div class="stock-modal-header">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h3 style="font-size: 1.60rem; color: #d9381e; font-weight: 800; margin: 0; font-family: 'Segoe Script', cursive; line-height: 1.1;">Calculadora</h3>
        <div class="lblFechaTrabajoStock" style="font-size: 14px; color: #64748b; font-weight: 700; line-height: 1.2;">Fecha de Trabajo: -</div>
      </div>
      <button onclick="window.cerrarCalculadoraStock()" title="Cerrar Calculadora" style="background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;">
        <img src="icono.png" alt="Logo BMA" style="width: 44px; height: 44px; object-fit: contain;">
      </button>
    </div>
    <p style="font-size: 14px; color: #64748b; margin: 0 0 8px;">Insumos, valor hora y tiempo de elaboración.</p>

    <label style="font-weight: bold; color: #334155; font-size: 14px; margin-top: 4px;">Materia Prima e Insumos:</label>
    
    <div class="calc-row">
      <input type="text" id="mat1_desc" placeholder="Material 1" style="flex: 2;">
      <input type="number" id="mat1_val" placeholder="$ Costo" step="0.01" style="flex: 1;" oninput="window.calcularTotalModalStock()">
    </div>
    <div class="calc-row">
      <input type="text" id="mat2_desc" placeholder="Material 2" style="flex: 2;">
      <input type="number" id="mat2_val" placeholder="$ Costo" step="0.01" style="flex: 1;" oninput="window.calcularTotalModalStock()">
    </div>
    <div class="calc-row">
      <input type="text" id="mat3_desc" placeholder="Material 3" style="flex: 2;">
      <input type="number" id="mat3_val" placeholder="$ Costo" step="0.01" style="flex: 1;" oninput="window.calcularTotalModalStock()">
    </div>
    <div class="calc-row">
      <input type="text" id="mat4_desc" placeholder="Material 4" style="flex: 2;">
      <input type="number" id="mat4_val" placeholder="$ Costo" step="0.01" style="flex: 1;" oninput="window.calcularTotalModalStock()">
    </div>

    <label style="font-weight: bold; color: #334155; margin-top: 8px; font-size: 14px;">Mano de Obra:</label>
    <div class="calc-row">
      <div style="flex: 1; min-width: 0;">
        <label style="font-size: 14px; margin-top: 0;">Valor Hora ($):</label>
        <input type="number" id="calcValorHora" value="10000" placeholder="0.00" step="100" oninput="window.calcularTotalModalStock()" style="border: 1.5px solid #cbd5e1; background: #f8fafc; color: #1e293b; border-radius: 8px; padding: 8px 10px;">
      </div>
      <div style="flex: 1; min-width: 0;">
        <label style="font-size: 14px; margin-top: 0;">Minutos:</label>
        <input type="number" id="calcMinutos" placeholder="Ej: 25" step="1" oninput="window.calcularTotalModalStock()" style="border: 1.5px solid #cbd5e1; background: #f8fafc; color: #1e293b; border-radius: 8px; padding: 8px 10px;">
      </div>
    </div>
    
    <div style="font-size: 17px; color: #0f172a; font-weight: 700; margin-top: 4px; text-align: right;">
      Costo tiempo: $<span id="lblCostoManoObra">0.00</span>
    </div>

    <!-- Margen de ganancia alineado a la derecha con el % adentro -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
      <label style="font-weight: bold; color: #334155; font-size: 14px; margin-top: 0;">Margen de Ganancia:</label>
      <div style="display: flex; align-items: center; border: 1.5px solid #cbd5e1; background: #f8fafc; border-radius: 8px; width: 110px; overflow: hidden;">
        <span style="padding-left: 10px; font-size: 14px; font-weight: bold; color: #4b5563; user-select: none;">%</span>
        <input type="number" id="calcGanancia" placeholder="50" value="50" step="1" style="width: 100%; border: none; background: transparent; color: #1e293b; padding: 8px 10px 8px 4px; outline: none; font-size: 14px;" oninput="window.calcularTotalModalStock()">
      </div>
    </div>

    <!-- Marco del costo total pintado de bermellón -->
    <div style="background: #f1f5f9; border: 1.5px solid #d9381e; padding: 10px; border-radius: 10px; margin-top: 10px; text-align: right;">
      <div style="font-size: 14px; color: #64748b;">Costo Total: $<span id="lblCostoTotal">0.00</span></div>
      <div style="font-size: 1.1rem; font-weight: 800; color: #0f172a; margin-top: 2px;">Precio Sugerido: $<span id="lblPrecioFinal">0.00</span></div>
    </div>

    <!-- Botón Usar este Precio con relleno gris topo y letras blancas -->
    <button style="background: #64748b; color: #ffffff; border: 1.5px solid #d9381e; padding: 12px; width: 100%; border-radius: 10px; font-weight: 800; font-size: 0.95rem; margin-top: 10px; cursor: pointer;" onclick="window.aplicarPrecioCalculadoStock()">Usar este Precio</button>
    
    <!-- Botón Cerrar en negro con letras y marco rojo bermellón -->
    <button style="background: #000000; color: #d9381e; border: 1.5px solid #d9381e; padding: 12px; width: 100%; border-radius: 10px; font-weight: 800; font-size: 0.95rem; margin-top: 8px; cursor: pointer;" onclick="window.cerrarCalculadoraStock()">Cerrar</button>
  </div>
</div>

<script>
  window.cerrarVentanaModalStockGen = function() {
    if (typeof cerrarModalDinamico === 'function') {
      cerrarModalDinamico();
    } else {
      window.location.href = 'menu.html';
    }
  };

  window.cerrarModalStockActual = function() {
    const modalStockActual = document.getElementById('modal-stock-actual');
    if (modalStockActual) modalStockActual.classList.remove('active');
  };

  (function() {
    function obtenerFechaLocal() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    const fechaSesionStock = localStorage.getItem('bma_fechaSesion') || obtenerFechaLocal();

    function formatearFechaStock(fechaStr) {
      if (!fechaStr) return '';
      const partes = fechaStr.split('-');
      return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : fechaStr;
    }

    const lblsFechaStock = document.querySelectorAll('.lblFechaTrabajoStock');
    lblsFechaStock.forEach(el => {
      el.innerText = 'Fecha de Trabajo: ' + formatearFechaStock(fechaSesionStock);
    });

    let inventarioStock = [];
    let editandoIndexStock = null;

    function obtenerStockSafe() {
      try {
        const guardados = localStorage.getItem('bma_stock');
        return guardados ? JSON.parse(guardados) : [];
      } catch (e) {
        console.error("Error cargando stock BMA:", e);
        return [];
      }
    }

    inventarioStock = obtenerStockSafe();
    actualizarContadorBotonStock();

    function actualizarContadorBotonStock() {
      const btnReg = document.getElementById('btnAbrirModalStock');
      if (btnReg) {
        btnReg.innerText = `Mostrar Registros (${inventarioStock.length})`;
      }
    }

    window.actualizarPantallaStock = function() {
      const listaContainer = document.getElementById('listaStock');
      const txtBuscar = document.getElementById('txtBuscarStock');
      if (!listaContainer) return;
      listaContainer.innerHTML = '';

      const filtro = txtBuscar ? txtBuscar.value.toLowerCase().trim() : '';
      const filtrados = inventarioStock.filter(p => {
        const nombre = (p.producto || p.articulo || p.nombre || '').toLowerCase();
        return nombre.includes(filtro);
      });

      if (filtrados.length === 0) {
        listaContainer.innerHTML = '<div style="text-align: center; color: #94a3b8; font-size: 14px; padding: 15px;">No se encontraron productos.</div>';
      } else {
        for (let i = 0; i < filtrados.length; i++) {
          const p = filtrados[i];
          const realIndex = inventarioStock.indexOf(p);
          const nombreItem = p.producto || p.articulo || p.nombre || 'Sin nombre';
          const cantActual = p.cantidad !== undefined ? p.cantidad : (p.stock || 0);
          const precioActual = Number(p.precio || 0).toFixed(2);

          const esStockCritico = cantActual <= 3;
          const colorCant = esStockCritico ? '#ef4444' : '#0f172a';
          const avisoCriticoHtml = esStockCritico ? '<span style="background: #fee2e2; color: #ef4444; font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-left: 4px;">Stock Bajo</span>' : '';

          const item = document.createElement('div');
          item.className = 'stock-item';
          item.innerHTML = `
            <div style="display: flex; flex-direction: column; gap: 3px;">
              <span style="font-weight: bold; color: #1e293b; font-size: 14px;">${nombreItem}</span>
              <span style="font-size: 14px; color: #64748b;">Precio: $${precioActual}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="display: flex; align-items: center; gap: 2px;">
                <span style="font-weight: bold; font-size: 14px; color: ${colorCant};">${cantActual} un.</span>
                ${avisoCriticoHtml}
              </div>
              <div style="display:flex; gap:4px;">
                <button onclick="window.cargarParaEditarStock(${realIndex})" style="background: #e0f2fe; color: #0369a1; border: none; font-size: 0.8rem; font-weight: bold; cursor: pointer; padding: 6px 8px; border-radius: 6px;">Editar</button>
                <button onclick="window.eliminarProductoStock(${realIndex})" style="background: #fee2e2; color: #b91c1c; border: none; font-size: 0.8rem; font-weight: bold; cursor: pointer; padding: 6px 8px; border-radius: 6px;">Eliminar</button>
              </div>
            </div>
          `;
          listaContainer.appendChild(item);
        }
      }
    };

    window.guardarProductoStock = function() {
      const txtProd = document.getElementById('txtProducto');
      const txtCant = document.getElementById('txtCantidad');
      const txtPrec = document.getElementById('txtPrecio');

      const producto = txtProd ? txtProd.value.trim() : '';
      const cantidad = parseInt(txtCant ? txtCant.value : 0);
      const precio = parseFloat(txtPrec ? txtPrec.value : 0) || 0;

      if (!producto) {
        alert('Por favor, ingresá el nombre del producto.');
        return;
      }
      if (isNaN(cantidad) || cantidad <= 0) {
        alert('Por favor, ingresá una cantidad válida.');
        return;
      }

      const objetoStock = { 
        producto: producto, 
        articulo: producto,
        nombre: producto,
        cantidad: cantidad, 
        stock: cantidad,
        precio: precio, 
        fecha: editandoIndexStock !== null ? (inventarioStock[editandoIndexStock].fecha || fechaSesionStock) : fechaSesionStock 
      };

      if (editandoIndexStock !== null) {
        inventarioStock[editandoIndexStock] = objetoStock;
        window.cancelarEdicionStock();
      } else {
        inventarioStock.push(objetoStock);
        limpiarFormularioStock();
      }

      guardarYActualizarStock();
    };

    window.cargarParaEditarStock = function(index) {
      const p = inventarioStock[index];
      if (!p) return;

      document.getElementById('txtProducto').value = p.producto || p.articulo || p.nombre || '';
      document.getElementById('txtCantidad').value = p.cantidad !== undefined ? p.cantidad : (p.stock || 0);
      document.getElementById('txtPrecio').value = p.precio || 0;

      editandoIndexStock = index;
      const lblTitulo = document.getElementById('lblTituloStockForm');
      if (lblTitulo) lblTitulo.innerText = 'Editar Productos';
      const btnAccion = document.getElementById('btnAccionStock');
      if (btnAccion) {
        btnAccion.innerText = 'Actualizar Productos';
        btnAccion.style.background = '#e2e8f0';
        btnAccion.style.borderColor = '#94a3b8';
      }
      const btnCancel = document.getElementById('btnCancelarStock');
      if (btnCancel) btnCancel.style.display = 'block';

      window.cerrarModalStockActual();
    };

    window.cancelarEdicionStock = function() {
      editandoIndexStock = null;
      const lblTitulo = document.getElementById('lblTituloStockForm');
      if (lblTitulo) lblTitulo.innerText = 'Agregar Productos';
      const btnAccion = document.getElementById('btnAccionStock');
      if (btnAccion) {
        btnAccion.innerText = 'Agregar Productos';
        btnAccion.style.background = '#f1f5f9';
        btnAccion.style.borderColor = '#cbd5e1';
      }
      const btnCancel = document.getElementById('btnCancelarStock');
      if (btnCancel) btnCancel.style.display = 'none';
      limpiarFormularioStock();
    };

    function limpiarFormularioStock() {
      if (document.getElementById('txtProducto')) document.getElementById('txtProducto').value = '';
      if (document.getElementById('txtCantidad')) document.getElementById('txtCantidad').value = '';
      if (document.getElementById('txtPrecio')) document.getElementById('txtPrecio').value = '';
    }

    window.eliminarProductoStock = function(index) {
      if (confirm('¿Querés eliminar este producto del stock?')) {
        if (editandoIndexStock === index) {
          window.cancelarEdicionStock();
        } else if (editandoIndexStock !== null && editandoIndexStock > index) {
          editandoIndexStock--; 
        }
        inventarioStock.splice(index, 1);
        guardarYActualizarStock();
      }
    };

    window.imprimirStock = function() {
      if (inventarioStock.length === 0) return alert('No hay productos en stock para imprimir.');

      const txtBuscar = document.getElementById('txtBuscarStock');
      const filtro = txtBuscar ? txtBuscar.value.toLowerCase().trim() : '';
      const listaAImprimir = inventarioStock.filter(p => {
        const nombre = (p.producto || p.articulo || p.nombre || '').toLowerCase();
        return nombre.includes(filtro);
      });

      if (listaAImprimir.length === 0) return alert('No hay productos que coincidan con la búsqueda.');

      const fechaTxt = document.querySelector('.lblFechaTrabajoStock')?.innerText || '';

      let filas = listaAImprimir.map((p, idx) => {
        const cant = p.cantidad !== undefined ? p.cantidad : (p.stock || 0);
        const precio = Number(p.precio || 0).toFixed(2);
        return `
          <tr>
            <td style="padding: 8px; border: 1px solid #cbd5e1; text-align: center;">${idx + 1}</td>
            <td style="padding: 8px; border: 1px solid #cbd5e1; font-weight: bold;">${p.producto || p.articulo || p.nombre || '-'}</td>
            <td style="padding: 8px; border: 1px solid #cbd5e1; text-align: center;">${cant} un.</td>
            <td style="padding: 8px; border: 1px solid #cbd5e1; text-align: right;">$${precio}</td>
          </tr>
        `;
      }).join('');

      const htmlPrint = `
        <!DOCTYPE html>
        <html>
        <head>
          <title>Inventario de Stock - BMA</title>
          <style>
            body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; color: #1e293b; }
            h2 { color: #d9381e; margin-bottom: 4px; font-size: 1.5rem; }
            .sub { color: #64748b; font-size: 14px; font-weight: bold; margin-bottom: 16px; }
            table { width: 100%; border-collapse: collapse; font-size: 14px; }
            th { background: #0f172a; color: white; padding: 8px; text-align: left; border: 1px solid #0f172a; }
            @media print {
              @page { margin: 1cm; }
            }
          </style>
        </head>
        <body>
          <h2>Inventario de Stock BMA</h2>
          <div class="sub">${fechaTxt} | Total: ${listaAImprimir.length} productos</div>
          <table>
            <thead>
              <tr>
                <th style="width: 30px; text-align: center;">#</th>
                <th>Producto / Artículo</th>
                <th style="text-align: center;">Cantidad</th>
                <th style="text-align: right;">Precio ($)</th>
              </tr>
            </thead>
            <tbody>
              ${filas}
            </tbody>
          </table>
          <script>
            window.onload = function() {
              window.print();
              setTimeout(function() { window.close(); }, 500);
            };
          <\/script>
        </body>
        </html>
      `;

      const win = window.open('', '_blank');
      if (win) {
        win.document.write(htmlPrint);
        win.document.close();
      } else {
        alert('Por favor, permití las ventanas emergentes en el navegador para imprimir o guardar como PDF.');
      }
    };

    function guardarYActualizarStock() {
      localStorage.setItem('bma_stock', JSON.stringify(inventarioStock));
      actualizarContadorBotonStock();
      window.actualizarPantallaStock();
    }

    window.abrirCalculadoraStock = function() {
      const modalCalc = document.getElementById('modalCalculadoraStock');
      if (modalCalc) modalCalc.classList.add('active');
      window.calcularTotalModalStock();
    };

    window.cerrarCalculadoraStock = function() {
      const modalCalc = document.getElementById('modalCalculadoraStock');
      if (modalCalc) modalCalc.classList.remove('active');
      resetearCalculadoraStock();
    };

    function resetearCalculadoraStock() {
      const ids = ['mat1_desc', 'mat1_val', 'mat2_desc', 'mat2_val', 'mat3_desc', 'mat3_val', 'mat4_desc', 'mat4_val', 'calcMinutos'];
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      const vh = document.getElementById('calcValorHora'); if (vh) vh.value = '10000';
      const cg = document.getElementById('calcGanancia'); if (cg) cg.value = '50';

      const lbls = ['lblCostoManoObra', 'lblCostoTotal', 'lblPrecioFinal'];
      lbls.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerText = '0.00';
      });
    }

    window.calcularTotalModalStock = function() {
      const m1 = parseFloat(document.getElementById('mat1_val').value) || 0;
      const m2 = parseFloat(document.getElementById('mat2_val').value) || 0;
      const m3 = parseFloat(document.getElementById('mat3_val').value) || 0;
      const m4 = parseFloat(document.getElementById('mat4_val').value) || 0;

      const valorHora = parseFloat(document.getElementById('calcValorHora').value) || 0;
      const minutos = parseFloat(document.getElementById('calcMinutos').value) || 0;
      
      const costoManoObra = (minutos / 60) * valorHora;
      const gananciaPct = parseFloat(document.getElementById('calcGanancia').value) || 0;

      const costoTotalInsumos = m1 + m2 + m3 + m4;
      const costoTotal = costoTotalInsumos + costoManoObra;
      const precioFinal = costoTotal * (1 + (gananciaPct / 100));

      const lblCMO = document.getElementById('lblCostoManoObra'); if (lblCMO) lblCMO.innerText = costoManoObra.toFixed(2);
      const lblCT = document.getElementById('lblCostoTotal'); if (lblCT) lblCT.innerText = costoTotal.toFixed(2);
      const lblPF = document.getElementById('lblPrecioFinal'); if (lblPF) lblPF.innerText = precioFinal.toFixed(2);
    };

    window.aplicarPrecioCalculadoStock = function() {
      const lblPF = document.getElementById('lblPrecioFinal');
      const precioFinal = lblPF ? lblPF.innerText : '0.00';
      const txtPrecio = document.getElementById('txtPrecio');
      if (txtPrecio) txtPrecio.value = precioFinal;
      window.cerrarCalculadoraStock();
    };

    const modalStockActual = document.getElementById('modal-stock-actual');
    const modalCalc = document.getElementById('modalCalculadoraStock');
    const btnAbrirStock = document.getElementById('btnAbrirModalStock');

    if (btnAbrirStock && modalStockActual) {
      btnAbrirStock.onclick = function() { modalStockActual.classList.add('active'); window.actualizarPantallaStock(); };
    }
    
    if (modalStockActual) {
      modalStockActual.onclick = function(e) {
        if (e.target === modalStockActual) window.cerrarModalStockActual();
      };
    }
    if (modalCalc) {
      modalCalc.onclick = function(e) {
        if (e.target === modalCalc) window.cerrarCalculadoraStock();
      };
    }

    window.actualizarPantallaStock();
  })();
</script>
