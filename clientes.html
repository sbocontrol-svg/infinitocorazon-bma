<!-- Encabezado Limpio del Modal -->
<div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1.5px solid #e2e8f0; padding-bottom: 2px;">
  <div style="display: flex; flex-direction: column; justify-content: space-between; height: 44px;">
    <h3 id="lblTituloForm" style="font-size: 1.05rem; color: #0f172a; font-weight: 800; margin: 0; line-height: 1;">👥 Registrar Cliente</h3>
    <div id="lblFechaTrabajo" style="font-size: 0.80rem; color: #64748b; font-weight: 700; line-height: 1;">Fecha de Trabajo: -</div>
  </div>
  
  <button onclick="window.cerrarVentanaModal()" title="Volver al Menú" style="background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;">
    <img src="icono.png" alt="Logo BMA" style="width: 44px; height: 44px; object-fit: contain;">
  </button>
</div>

<!-- VISTA 1: FORMULARIO -->
<div id="vista-formulario">
  <label style="font-size: 11px; font-weight: 700; color: #475569; display: block; margin-top: 10px; text-align: left; text-transform: uppercase; letter-spacing: 0.5px;">Nombre y Apellido / Razón Social:</label>
  <input type="text" id="txtNombre" placeholder="Ej: Juan Pérez" style="width: 100%; padding: 10px; margin-top: 4px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; background: #f8fafc; color: #1e293b; outline: none;">

  <label style="font-size: 11px; font-weight: 700; color: #475569; display: block; margin-top: 10px; text-align: left; text-transform: uppercase; letter-spacing: 0.5px;">Teléfono / WhatsApp:</label>
  <input type="text" id="txtTelefono" placeholder="Ej: 2364123456" style="width: 100%; padding: 10px; margin-top: 4px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; background: #f8fafc; color: #1e293b; outline: none;">

  <label style="font-size: 11px; font-weight: 700; color: #475569; display: block; margin-top: 10px; text-align: left; text-transform: uppercase; letter-spacing: 0.5px;">Localidad:</label>
  <input type="text" id="txtLocalidad" placeholder="Ej: Junín" style="width: 100%; padding: 10px; margin-top: 4px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; background: #f8fafc; color: #1e293b; outline: none;">

  <label style="font-size: 11px; font-weight: 700; color: #475569; display: block; margin-top: 10px; text-align: left; text-transform: uppercase; letter-spacing: 0.5px;">E-mail:</label>
  <input type="email" id="txtEmail" placeholder="Ej: juan@email.com" style="width: 100%; padding: 10px; margin-top: 4px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; background: #f8fafc; color: #1e293b; outline: none;">

  <button id="btnAccion" onclick="window.guardarCliente()" style="background: #0f172a; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: 700; font-size: 0.95rem; margin-top: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(15,23,42,0.3);">➕ Registrar Cliente</button>
  <button onclick="window.alternarVistaLista(true)" style="background: #475569; color: white; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: 700; font-size: 0.9rem; margin-top: 8px; cursor: pointer;">📋 Mostrar Registros</button>
  <button id="btnCancelarEdicion" onclick="window.cancelarEdicion()" style="background: #64748b; color: white; border: none; padding: 10px; width: 100%; border-radius: 10px; font-weight: 700; font-size: 0.85rem; margin-top: 8px; cursor: pointer; display: none;">Cancelar Edición</button>
  <button onclick="window.cerrarVentanaModal()" style="background: #334155; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 0.95rem; margin-top: 10px; cursor: pointer;">Volver al Menú</button>
</div>

<!-- VISTA 2: LISTADO -->
<div id="vista-listado" style="display: none;">
  <div style="margin-bottom: 8px;">
    <label style="font-size: 11px; font-weight: 700; color: #475569; display: block; margin-top: 0; text-align: left; text-transform: uppercase; letter-spacing: 0.5px;">🔍 Buscar Registro:</label>
    <input type="text" id="txtBuscar" placeholder="Nombre, localidad, tel..." oninput="window.actualizarPantallaClientes()" style="width: 100%; padding: 10px; margin-top: 4px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; background: #f8fafc; color: #1e293b; outline: none;">
  </div>

  <div id="listaClientes" style="margin-top: 8px; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;">
    <div style="text-align: center; color: #94a3b8; font-size: 0.85rem; padding: 15px;">No hay clientes registrados.</div>
  </div>

  <button onclick="window.alternarVistaLista(false)" style="background: #334155; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 0.95rem; margin-top: 10px; cursor: pointer;">⬅️ Volver al Formulario</button>
</div>

<script>
  window.cerrarVentanaModal = function() {
    if (typeof cerrarModalDinamico === 'function') {
      cerrarModalDinamico();
    } else {
      window.location.href = 'menu.html';
    }
  };

  (function() {
    function obtenerFechaLocal() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatearFechaLocal(fechaStr) {
      if (!fechaStr) return '';
      const partes = fechaStr.split('-');
      return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : fechaStr;
    }

    const fechaSesionLocal = localStorage.getItem('bma_fechaSesion') || localStorage.getItem('sbo_fechaSesion') || obtenerFechaLocal();
    const lblFecha = document.getElementById('lblFechaTrabajo');
    if (lblFecha) lblFecha.innerText = `Fecha de Trabajo: ${formatearFechaLocal(fechaSesionLocal)}`;

    let clientes = [];
    let editIndex = null;

    function obtenerClientesSafe() {
      try {
        const guardados = localStorage.getItem('bma_clientes') || localStorage.getItem('sbo_clientes') || localStorage.getItem('clientes');
        return guardados ? JSON.parse(guardados) : [];
      } catch (e) {
        console.error("Error al cargar clientes:", e);
        return [];
      }
    }

    clientes = obtenerClientesSafe();

    window.alternarVistaLista = function(mostrarLista) {
      const vistaForm = document.getElementById('vista-formulario');
      const vistaList = document.getElementById('vista-listado');
      if (vistaForm) vistaForm.style.display = mostrarLista ? 'none' : 'block';
      if (vistaList) vistaList.style.display = mostrarLista ? 'block' : 'none';
      if (mostrarLista) window.actualizarPantallaClientes();
    };

    window.actualizarPantallaClientes = function() {
      const listaContainer = document.getElementById('listaClientes');
      const txtBuscar = document.getElementById('txtBuscar');
      if (!listaContainer) return;

      const filtro = txtBuscar ? txtBuscar.value.toLowerCase().trim() : '';
      listaContainer.innerHTML = '';

      const filtrados = clientes.filter(c => {
        const nombre = (c.nombre || c.cliente || c.AyN || '').toLowerCase();
        const localidad = (c.localidad || '').toLowerCase();
        const telefono = (c.telefono || c.tel || '').toLowerCase();
        const email = (c.email || '').toLowerCase();
        return nombre.includes(filtro) || localidad.includes(filtro) || telefono.includes(filtro) || email.includes(filtro);
      });

      if (filtrados.length === 0) {
        listaContainer.innerHTML = '<div style="text-align: center; color: #94a3b8; font-size: 0.85rem; padding: 15px;">No se encontraron clientes.</div>';
      } else {
        filtrados.forEach((c) => {
          const realIndex = clientes.indexOf(c);
          const nombreCli = c.nombre || c.cliente || c.AyN || 'Sin nombre';
          const telCli = c.telefono || c.tel || 'Sin tel';
          const locCli = c.localidad || 'Sin localidad';
          const emailCli = c.email || 'Sin correo';

          const item = document.createElement('div');
          item.style.cssText = "display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8fafc; border-radius: 10px; border: 1.5px solid #e2e8f0; font-size: 0.85rem;";
          item.innerHTML = `
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-weight: bold; color: #1e293b; font-size: 0.9rem;">${nombreCli}</span>
              <span style="font-size: 0.78rem; color: #64748b;">📞 ${telCli} | 📍 ${locCli}</span>
              <span style="font-size: 0.78rem; color: #64748b;">✉️ ${emailCli}</span>
            </div>
            <div style="display: flex; gap: 6px; align-items: center;">
              <button onclick="window.cargarEdicionCliente(${realIndex})" style="background: #e0f2fe; border: none; color: #0369a1; font-size: 0.8rem; font-weight: bold; cursor: pointer; padding: 6px 8px; border-radius: 6px;" title="Editar">✏️</button>
              <button onclick="window.eliminarClienteItem(${realIndex})" style="background: #fee2e2; border: none; color: #b91c1c; font-size: 0.8rem; font-weight: bold; cursor: pointer; padding: 6px 8px; border-radius: 6px;" title="Eliminar">❌</button>
            </div>
          `;
          listaContainer.appendChild(item);
        });
      }
    };

    window.guardarCliente = function() {
      const txtNom = document.getElementById('txtNombre');
      const txtTel = document.getElementById('txtTelefono');
      const txtLoc = document.getElementById('txtLocalidad');
      const txtEm = document.getElementById('txtEmail');

      const nombre = txtNom ? txtNom.value.trim() : '';
      const telefono = txtTel ? txtTel.value.trim() : '';
      const localidad = txtLoc ? txtLoc.value.trim() : '';
      const email = txtEm ? txtEm.value.trim() : '';

      if (!nombre) return alert('Por favor, ingresá el nombre del cliente.');

      const clienteObj = { 
        nombre, 
        cliente: nombre, 
        AyN: nombre, 
        telefono, 
        tel: telefono, 
        localidad, 
        email 
      };

      if (editIndex !== null) {
        clientes[editIndex] = clienteObj;
        window.cancelarEdicion();
      } else {
        clientes.push(clienteObj);
        if (txtNom) txtNom.value = '';
        if (txtTel) txtTel.value = '';
        if (txtLoc) txtLoc.value = '';
        if (txtEm) txtEm.value = '';
      }

      guardarYActualizarClientes();
    };

    window.cargarEdicionCliente = function(index) {
      const c = clientes[index];
      if (!c) return;

      if (document.getElementById('txtNombre')) document.getElementById('txtNombre').value = c.nombre || c.cliente || c.AyN || '';
      if (document.getElementById('txtTelefono')) document.getElementById('txtTelefono').value = c.telefono || c.tel || '';
      if (document.getElementById('txtLocalidad')) document.getElementById('txtLocalidad').value = c.localidad || '';
      if (document.getElementById('txtEmail')) document.getElementById('txtEmail').value = c.email || '';

      editIndex = index;
      const lblTit = document.getElementById('lblTituloForm');
      if (lblTit) lblTit.innerText = '✏️ Editar Cliente';
      const btnAccion = document.getElementById('btnAccion');
      if (btnAccion) {
        btnAccion.innerText = '💾 Actualizar Cliente';
        btnAccion.style.background = '#3b82f6';
      }
      const btnCanc = document.getElementById('btnCancelarEdicion');
      if (btnCanc) btnCanc.style.display = 'block';

      window.alternarVistaLista(false);
    };

    window.cancelarEdicion = function() {
      editIndex = null;
      if (document.getElementById('txtNombre')) document.getElementById('txtNombre').value = '';
      if (document.getElementById('txtTelefono')) document.getElementById('txtTelefono').value = '';
      if (document.getElementById('txtLocalidad')) document.getElementById('txtLocalidad').value = '';
      if (document.getElementById('txtEmail')) document.getElementById('txtEmail').value = '';

      const lblTit = document.getElementById('lblTituloForm');
      if (lblTit) lblTit.innerText = '👥 Registrar Cliente';
      const btnAccion = document.getElementById('btnAccion');
      if (btnAccion) {
        btnAccion.innerText = '➕ Registrar Cliente';
        btnAccion.style.background = '#0f172a';
      }
      const btnCanc = document.getElementById('btnCancelarEdicion');
      if (btnCanc) btnCanc.style.display = 'none';
    };

    window.eliminarClienteItem = function(index) {
      if (confirm('¿Querés eliminar este cliente?')) {
        if (editIndex === index) {
          window.cancelarEdicion();
        } else if (editIndex !== null && editIndex > index) {
          editIndex--;
        }
        clientes.splice(index, 1);
        guardarYActualizarClientes();
        window.actualizarPantallaClientes();
      }
    };

    function guardarYActualizarClientes() {
      localStorage.setItem('bma_clientes', JSON.stringify(clientes));
    }
  })();
</script>
