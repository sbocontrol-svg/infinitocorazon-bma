<style>
  .caja-container-box *, .caja-modal-overlay * { 
    box-sizing: border-box; 
    font-family: system-ui, -apple-system, sans-serif; 
  }
  
  .caja-container-box {
    width: 100%;
    background: #ffffff;
    border-radius: 12px;
    padding: 4px;
  }

  .caja-container-box label { 
    font-size: 14px; 
    font-weight: 700; 
    color: #334155; 
    display: block; 
    margin-top: 10px; 
    text-align: left; 
    text-transform: uppercase; 
  }
  
  .caja-container-box input, .caja-container-box select { 
    width: 100%; 
    padding: 12px 14px; 
    margin-top: 5px; 
    border: 1.5px solid #cbd5e1; 
    border-radius: 10px; 
    font-size: 14px; 
    background: #f8fafc; 
    color: #1e293b; 
    outline: none; 
  }
  
  .caja-container-box input:focus, .caja-container-box select:focus {
    border-color: #3b82f6;
    background: #fff;
  }
  
  .caja-btn-main { 
    background: #e2e8f0; 
    color: #1e293b; 
    border: 1.5px solid #cbd5e1; 
    padding: 13px; 
    border-radius: 10px; 
    font-weight: bold; 
    font-size: 1rem; 
    cursor: pointer; 
    width: 100%; 
    margin-top: 14px; 
  }
  
  .caja-btn-secundario { 
    background: #0f172a; 
    color: #d9381e; 
    border: 1.5px solid #d9381e; 
    padding: 12px; 
    width: 100%; 
    border-radius: 10px; 
    font-weight: 800; 
    font-size: 0.95rem; 
    margin-top: 10px; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 6px; 
    text-decoration: none; 
  }
  
  .caja-btn-historial {
    background: #475569; 
    color: white; 
    border: none; 
    padding: 12px; 
    width: 100%; 
    border-radius: 10px; 
    font-weight: bold; 
    font-size: 1rem; 
    margin-top: 8px; 
    cursor: pointer;
  }
  
  .caja-btn-print { 
    background: #64748b; 
    color: white; 
    border: none; 
    padding: 11px; 
    width: 100%; 
    border-radius: 10px; 
    font-weight: bold; 
    font-size: 0.9rem; 
    margin-top: 8px; 
    cursor: pointer; 
    box-shadow: 0 2px 8px rgba(100,116,139,0.3); 
  }
  
  .caja-card { 
    background: #f8fafc; 
    border: 1.5px solid #e2e8f0; 
    border-radius: 12px; 
    padding: 12px; 
    margin-top: 10px; 
  }
  
  .caja-mov-item { 
    background: #fff; 
    border: 1.5px solid #e2e8f0; 
    padding: 10px 12px; 
    border-radius: 10px; 
    margin-bottom: 8px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
  }
  
  .caja-btn-del { 
    background: #fee2e2; 
    color: #ef4444; 
    border: none; 
    padding: 6px 12px; 
    border-radius: 6px; 
    font-weight: bold; 
    cursor: pointer; 
    font-size: 0.85rem; 
  }

  /* Modal Flotante Ajustado */
  .caja-modal-overlay {
    position: fixed;
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%;
    background: rgba(15, 23, 42, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 12px;
  }

  .caja-modal-card {
    background: #ffffff;
    width: 100%;
    max-width: 380px;
    max-height: 85vh;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
  }

  .caja-scroll-list {
    flex: 1;
    overflow-y: auto;
    margin: 10px 0;
    padding-right: 4px;
    max-height: 250px;
  }

  .caja-scroll-list::-webkit-scrollbar {
    width: 6px;
  }
  
  .caja-scroll-list::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
  }
</style>

<div class="caja-container-box">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1.5px solid #e2e8f0; padding-bottom: 6px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h3 style="font-size: 1.7rem; color: #d9381e; font-weight: 800; margin: 0; line-height: 1.1; font-family: 'Segoe Script', cursive;">Caja Chica</h3>
      <div class="lblFechaTrabajoCaja" style="font-size: 14px; color: #64748b; font-weight: 700; line-height: 1.2;">Fecha de Trabajo: -</div>
    </div>
    <button onclick="window.cerrarVentanaModalCajaGen()" title="Volver al Menú" style="background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;">
      <img src="icono.png" alt="Logo BMA" style="width: 44px; height: 44px; object-fit: contain;">
    </button>
  </div>

  <!-- Saldo Inicial -->
  <div id="cajaBloqueSaldoInicial" class="caja-card"></div>

  <!-- Total en Caja -->
  <div style="background: #e2e8f0; border: 2px solid #d9381e; border-radius: 12px; padding: 14px; margin-top: 10px; text-align: center;">
    <span style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; color: #d9381e;">Saldo Total en Caja</span>
    <div id="cajaSaldoActual" style="font-size: 1.6rem; font-weight: 800; margin-top: 2px; color: #d9381e;">$0</div>
  </div>

  <!-- Registro de Nuevo Movimiento -->
  <div class="caja-card">
    <strong style="font-size: 14px; color: #0f172a; display: block; margin-bottom: 4px; text-transform: uppercase;">Nuevo Movimiento</strong>
    
    <label style="margin-top: 4px;">Tipo de Movimiento:</label>
    <select id="cajaTipo">
      <option value="Ingreso">📥 Ingreso</option>
      <option value="Egreso">📤 Egreso</option>
    </select>
    
    <label>Concepto:</label>
    <input type="text" id="cajaConcepto" placeholder="Ej: Vuelto, Gasto de insumos...">
    
    <label>Monto ($):</label>
    <input type="number" id="cajaMonto" placeholder="0.00" step="any">
    
    <button class="caja-btn-main" onclick="window.agregarMovimientoCaja()">➕ Registrar Movimiento</button>
  </div>

  <!-- Botón abrir Historial Flotante -->
  <button class="caja-btn-historial" onclick="window.abrirModalMovimientos()">
    📋 Ver Historial de Movimientos
  </button>

  <button onclick="window.cerrarVentanaModalCajaGen()" class="caja-btn-secundario">Volver al Menú</button>
</div>

<!-- Modal Flotante de Historial -->
<div id="modalMovimientosCaja" class="caja-modal-overlay" onclick="if(event.target === this) window.cerrarModalMovimientos()">
  <div class="caja-modal-card">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h3 style="font-size: 1.4rem; color: #d9381e; font-weight: 800; margin: 0; font-family: 'Segoe Script', cursive; line-height: 1.1;">Movimientos del Día</h3>
        <div class="lblFechaTrabajoCaja" style="font-size: 12px; color: #64748b; font-weight: 700; line-height: 1.2;">Fecha de Trabajo: -</div>
      </div>
      <button onclick="window.cerrarModalMovimientos()" title="Volver" style="background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;">
        <img src="icono.png" alt="Logo BMA" style="width: 36px; height: 36px; object-fit: contain;">
      </button>
    </div>

    <div id="listaMovimientosCajaModal" class="caja-scroll-list"></div>

    <div style="border-top: 1px solid #e2e8f0; padding-top: 8px; margin-top: auto;">
      <button class="caja-btn-print" onclick="window.imprimirCajaChica()">
        🖨️ Imprimir / Guardar PDF
      </button>
      <button class="caja-btn-historial" style="margin-top: 6px; color: #d9381e;" onclick="window.cerrarModalMovimientos()">
        ⬅️ Volver
      </button>
    </div>
  </div>
</div>

<script>
  (function() {
    function obtenerFechaLocal() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatearMoneda(val) {
      return new Intl.NumberFormat('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(val || 0);
    }

    function obtenerDatosBma(clave, valorDefecto = null) {
      try {
        const item = localStorage.getItem(clave);
        return item ? JSON.parse(item) : valorDefecto;
      } catch (e) {
        console.error(`Error al leer ${clave}:`, e);
        return valorDefecto;
      }
    }

    function guardarDatosBma(clave, valor) {
      try {
        localStorage.setItem(clave, JSON.stringify(valor));
      } catch (e) {
        console.error(`Error al guardar ${clave}:`, e);
      }
    }

    window.cerrarVentanaModalCajaGen = function() { 
      if (typeof cerrarModalDinamico === 'function') {
        cerrarModalDinamico();
      } else {
        window.location.href = 'menu.html';
      }
    };

    const fechaSesion = localStorage.getItem('bma_fechaSesion') || obtenerFechaLocal();
    let movimientosCajaList = obtenerDatosBma('bma_caja_chica', []);
    let saldoInicialData = obtenerDatosBma('bma_saldo_inicial_data', {});

    function formatearFechaStock(fechaStr) {
      if (!fechaStr) return '';
      const partes = fechaStr.split('-');
      return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : fechaStr;
    }

    window.habilitarEdicionSaldo = function() {
      const bloque = document.getElementById('cajaBloqueSaldoInicial');
      if (!bloque) return;
      bloque.innerHTML = `
        <label style="margin-top:0;">Saldo Inicial de hoy ($):</label>
        <div style="display: flex; gap: 8px; margin-top: 4px;">
          <input type="number" id="cajaInputSaldo" placeholder="Ej: 5000" style="margin-top:0;" step="any">
          <button class="caja-btn-main" style="margin-top:0; width: auto; padding: 0 16px; border: 1.5px solid #000000;" onclick="window.guardarSaldoInicial()">OK</button>
        </div>
      `;
    };

    window.guardarSaldoInicial = function() {
      const input = document.getElementById('cajaInputSaldo');
      const val = parseFloat(input ? input.value : 0);
      if (isNaN(val)) return alert('Ingresá un número válido.');
      saldoInicialData[fechaSesion] = val;
      guardarDatosBma('bma_saldo_inicial_data', saldoInicialData);
      window.renderizarCajaChica();
    };

    window.agregarMovimientoCaja = function() {
      const tipoElem = document.getElementById('cajaTipo');
      const concElem = document.getElementById('cajaConcepto');
      const montElem = document.getElementById('cajaMonto');

      const tipo = tipoElem ? tipoElem.value : 'Ingreso';
      const concepto = concElem ? concElem.value.trim() : '';
      const monto = parseFloat(montElem ? montElem.value : 0) || 0;

      if (!concepto || monto <= 0) return alert('Por favor completá el concepto y un monto válido.');
      
      movimientosCajaList.unshift({ id: Date.now(), fecha: fechaSesion, tipo, concepto, monto });
      guardarDatosBma('bma_caja_chica', movimientosCajaList);
      
      if (concElem) concElem.value = '';
      if (montElem) montElem.value = '';
      
      window.renderizarCajaChica();
    };

    window.eliminarMovimientoCaja = function(id) {
      if (confirm('¿Querés eliminar este movimiento?')) {
        movimientosCajaList = movimientosCajaList.filter(m => m.id !== id);
        guardarDatosBma('bma_caja_chica', movimientosCajaList);
        window.renderizarCajaChica();
        window.renderizarMovimientosModal();
      }
    };

    window.renderizarCajaChica = function() {
      const lblsFecha = document.querySelectorAll('.lblFechaTrabajoCaja');
      lblsFecha.forEach(el => {
        el.innerText = 'Fecha de Trabajo: ' + formatearFechaStock(fechaSesion);
      });
      
      const saldoIni = saldoInicialData[fechaSesion] !== undefined ? saldoInicialData[fechaSesion] : null;
      const bloqueSaldo = document.getElementById('cajaBloqueSaldoInicial');
      
      if (bloqueSaldo) {
        if (saldoIni !== null) {
          bloqueSaldo.innerHTML = `
            <p style="font-size:14px; text-align:center; margin:2px 0; color:#1e293b; font-weight: bold;">
               Saldo inicial fijado: <span style="color:#d9381e;">$${formatearMoneda(saldoIni)}</span> 
               <button onclick="window.habilitarEdicionSaldo()" style="background:none; border:none; color:#3b82f6; text-decoration:underline; cursor:pointer; font-size:13px; font-weight:700; margin-left:6px;">Editar</button>
            </p>`;
        } else {
          window.habilitarEdicionSaldo();
        }
      }

      const movimientosJornada = movimientosCajaList.filter(m => m.fecha === fechaSesion);
      let saldoCalculado = saldoIni || 0;
      movimientosJornada.forEach(m => {
        saldoCalculado += (m.tipo === 'Ingreso' ? m.monto : -m.monto);
      });

      const elemSaldo = document.getElementById('cajaSaldoActual');
      if (elemSaldo) elemSaldo.innerText = `$${formatearMoneda(saldoCalculado)}`;
    };

    window.abrirModalMovimientos = function() {
      window.renderizarMovimientosModal();
      const modal = document.getElementById('modalMovimientosCaja');
      if (modal) modal.style.display = 'flex';
    };

    window.cerrarModalMovimientos = function() {
      const modal = document.getElementById('modalMovimientosCaja');
      if (modal) modal.style.display = 'none';
    };

    window.renderizarMovimientosModal = function() {
      const listaContainer = document.getElementById('listaMovimientosCajaModal');
      if (!listaContainer) return;

      const movimientosJornada = movimientosCajaList.filter(m => m.fecha === fechaSesion);
      let html = '';

      movimientosJornada.forEach(m => {
        html += `
          <div class="caja-mov-item">
            <div>
              <strong style="font-size:14px; color:#0f172a;">${m.concepto}</strong><br>
              <small style="color:#64748b; font-size:12px; font-weight:bold;">${m.tipo}</small>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-weight:800; font-size:14px; color:${m.tipo === 'Ingreso' ? '#16a34a' : '#dc2626'}">
                ${m.tipo === 'Ingreso' ? '+' : '-'}$${formatearMoneda(m.monto)}
              </span>
              <button class="caja-btn-del" onclick="window.eliminarMovimientoCaja(${m.id})">✕</button>
            </div>
          </div>`;
      });

      listaContainer.innerHTML = html || '<p style="text-align:center; color:#94a3b8; font-size:14px; margin-top: 20px;">Sin movimientos hoy.</p>';
    };

    window.imprimirCajaChica = function() {
      const movimientosJornada = movimientosCajaList.filter(m => m.fecha === fechaSesion);
      const saldoIni = saldoInicialData[fechaSesion] !== undefined ? saldoInicialData[fechaSesion] : 0;
      
      let saldoCalculado = saldoIni;
      movimientosJornada.forEach(m => {
        saldoCalculado += (m.tipo === 'Ingreso' ? m.monto : -m.monto);
      });

      let filas = movimientosJornada.map((m, idx) => {
        return `
          <tr>
            <td style="padding: 8px; border: 1px solid #cbd5e1; text-align: center;">${idx + 1}</td>
            <td style="padding: 8px; border: 1px solid #cbd5e1; font-weight: bold;">${m.concepto}</td>
            <td style="padding: 8px; border: 1px solid #cbd5e1; text-align: center;">${m.tipo}</td>
            <td style="padding: 8px; border: 1px solid #cbd5e1; text-align: right; color: ${m.tipo === 'Ingreso' ? '#16a34a' : '#dc2626'}; font-weight: bold;">
              ${m.tipo === 'Ingreso' ? '+' : '-'}$${formatearMoneda(m.monto)}
            </td>
          </tr>
        `;
      }).join('');

      if (filas === '') {
        filas = `<tr><td colspan="4" style="padding: 15px; border: 1px solid #cbd5e1; text-align: center; color: #94a3b8;">No hay movimientos registrados hoy.</td></tr>`;
      }

      const fechaTxt = document.querySelector('.lblFechaTrabajoCaja')?.innerText || '';

      const htmlPrint = `
        <!DOCTYPE html>
        <html>
        <head>
          <title>Caja Chica - BMA</title>
          <style>
            body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; color: #1e293b; }
            h2 { color: #d9381e; margin-bottom: 4px; font-size: 1.5rem; }
            .sub { color: #64748b; font-size: 14px; font-weight: bold; margin-bottom: 12px; }
            .resumen { background: #f8fafc; border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
            table { width: 100%; border-collapse: collapse; font-size: 14px; }
            th { background: #0f172a; color: white; padding: 8px; text-align: left; border: 1px solid #0f172a; }
            @media print {
              @page { margin: 1cm; }
            }
          </style>
        </head>
        <body>
          <h2>Caja Chica BMA</h2>
          <div class="sub">${fechaTxt}</div>
          <div class="resumen">
            <div>Saldo Inicial: <strong>$${formatearMoneda(saldoIni)}</strong></div>
            <div style="margin-top: 4px; font-size: 1.1rem; font-weight: bold; color: #0f172a;">Saldo Total en Caja: $${formatearMoneda(saldoCalculado)}</div>
          </div>
          <table>
            <thead>
              <tr>
                <th style="width: 30px; text-align: center;">#</th>
                <th>Concepto</th>
                <th style="text-align: center;">Tipo</th>
                <th style="text-align: right;">Monto ($)</th>
              </tr>
            </thead>
            <tbody>
              ${filas}
            </tbody>
          </table>
          <script>
            window.onload = function() {
              window.print();
              setTimeout(function() { window.close(); }, 500);
            };
          <\/script>
        </body>
        </html>
      `;

      const win = window.open('', '_blank');
      if (win) {
        win.document.write(htmlPrint);
        win.document.close();
      } else {
        alert('Por favor, permití las ventanas emergentes en el navegador para imprimir o guardar como PDF.');
      }
    };

    window.renderizarCajaChica();
  })();
</script>
