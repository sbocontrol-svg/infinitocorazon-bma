<style>
  .caja-container-box *, .caja-modal-overlay * { 
    box-sizing: border-box; 
    font-family: system-ui, -apple-system, sans-serif; 
  }
  .caja-container-box label { 
    font-size: 11px; 
    font-weight: 700; 
    color: #475569; 
    display: block; 
    margin-top: 10px; 
    text-align: left; 
    text-transform: uppercase; 
    letter-spacing: 0.5px; 
  }
  .caja-container-box input, .caja-container-box select { 
    width: 100%; 
    padding: 10px; 
    margin-top: 4px; 
    border: 1.5px solid #cbd5e1; 
    border-radius: 10px; 
    font-size: 14px; 
    background: #f8fafc; 
    color: #1e293b; 
    outline: none; 
  }
  
  .caja-btn-main { 
    background: #0f172a; 
    color: white; 
    border: none; 
    padding: 12px; 
    border-radius: 8px; 
    font-weight: 700; 
    cursor: pointer; 
    width: 100%; 
    margin-top: 8px; 
    min-height: 44px; 
  }
  .caja-btn-secundario { 
    background: #334155; 
    color: white; 
    border: none; 
    padding: 12px; 
    width: 100%; 
    border-radius: 10px; 
    font-weight: bold; 
    font-size: 0.95rem; 
    margin-top: 10px; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 6px; 
    text-decoration: none; 
    min-height: 44px; 
  }
  
  .caja-card { 
    background: #f8fafc; 
    border: 1.5px solid #e2e8f0; 
    border-radius: 12px; 
    padding: 12px; 
    margin-top: 10px; 
  }
  .caja-mov-item { 
    background: #fff; 
    border: 1px solid #e2e8f0; 
    padding: 8px 10px; 
    border-radius: 8px; 
    margin-bottom: 6px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
  }
  .caja-btn-del { 
    background: #fee2e2; 
    color: #ef4444; 
    border: none; 
    padding: 6px 12px; 
    border-radius: 6px; 
    font-weight: bold; 
    cursor: pointer; 
    font-size: 0.8rem; 
    min-height: 36px; 
  }

  /* Modal Flotante */
  .caja-modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 16px;
  }

  .caja-modal-card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
  }

  .caja-scroll-list {
    flex: 1;
    overflow-y: auto;
    margin: 10px 0;
    padding-right: 4px;
  }

  .caja-scroll-list::-webkit-scrollbar {
    width: 6px;
  }
  .caja-scroll-list::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
  }
</style>

<div class="caja-container-box">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1.5px solid #e2e8f0; padding-bottom: 2px;">
    <div style="display: flex; flex-direction: column; justify-content: space-between; height: 44px;">
      <h3 style="font-size: 1.05rem; color: #0f172a; font-weight: 800; margin: 0; line-height: 1;">💵 Caja Chica</h3>
      <div id="lblFechaTrabajoCaja" style="font-size: 0.80rem; color: #64748b; font-weight: 700; line-height: 1;">Fecha de Trabajo: -</div>
    </div>
    <button onclick="window.cerrarVentanaModalCajaGen()" style="background: none; border: none; cursor: pointer; padding: 0;">
      <img src="icono.png" alt="Logo BMA" style="width: 44px; height: 44px; object-fit: contain;">
    </button>
  </div>

  <!-- Saldo Inicial -->
  <div id="cajaBloqueSaldoInicial" class="caja-card"></div>

  <!-- Total en Caja -->
  <div style="background: #0f172a; color: white; border-radius: 12px; padding: 12px; margin-top: 8px; text-align: center;">
    <span style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.9;">Saldo Total en Caja</span>
    <div id="cajaSaldoActual" style="font-size: 1.4rem; font-weight: 800; margin-top: 2px;">$0</div>
  </div>

  <!-- Registro de Nuevo Movimiento -->
  <div class="caja-card">
    <strong style="font-size: 0.85rem; color: #0f172a; display: block; margin-bottom: 6px;">Nuevo Movimiento</strong>
    <select id="cajaTipo">
      <option value="Ingreso">📥 Ingreso</option>
      <option value="Egreso">📤 Egreso</option>
    </select>
    <input type="text" id="cajaConcepto" placeholder="Concepto (ej: Vuelto, Gasto)">
    <input type="number" id="cajaMonto" placeholder="Monto ($)" step="any">
    <button class="caja-btn-main" style="background:#475569;" onclick="window.agregarMovimientoCaja()">➕ Registrar Movimiento</button>
  </div>

  <!-- Botón abrir Historial Flotante -->
  <button class="caja-btn-secundario" style="background:#1e293b;" onclick="window.abrirModalMovimientos()">
    📋 Ver Historial de Movimientos
  </button>

  <button onclick="window.cerrarVentanaModalCajaGen()" class="caja-btn-secundario">Volver al Menú</button>
</div>

<!-- Modal Flotante de Historial -->
<div id="modalMovimientosCaja" class="caja-modal-overlay" onclick="if(event.target === this) window.cerrarModalMovimientos()">
  <div class="caja-modal-card">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">
      <strong style="font-size: 1rem; color: #0f172a;">📋 Movimientos del Día</strong>
      <button onclick="window.cerrarModalMovimientos()" style="background:none; border:none; font-size: 1.2rem; cursor:pointer; color:#64748b;">✕</button>
    </div>

    <div id="listaMovimientosCajaModal" class="caja-scroll-list"></div>

    <div style="border-top: 1px solid #e2e8f0; padding-top: 10px; margin-top: auto;">
      <button class="caja-btn-main" style="background:#0f172a; margin: 0;" onclick="window.cerrarModalMovimientos()">
        Volver
      </button>
    </div>
  </div>
</div>

<script>
  (function() {
    function obtenerFechaLocal() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatearMoneda(val) {
      return new Intl.NumberFormat('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(val || 0);
    }

    function obtenerDatosBma(clave, valorDefecto = null) {
      try {
        const item = localStorage.getItem(clave);
        return item ? JSON.parse(item) : valorDefecto;
      } catch (e) {
        console.error(`Error al leer ${clave}:`, e);
        return valorDefecto;
      }
    }

    function guardarDatosBma(clave, valor) {
      try {
        localStorage.setItem(clave, JSON.stringify(valor));
      } catch (e) {
        console.error(`Error al guardar ${clave}:`, e);
      }
    }

    window.cerrarVentanaModalCajaGen = function() { 
      if (typeof cerrarModalDinamico === 'function') {
        cerrarModalDinamico();
      } else {
        window.location.href = 'menu.html';
      }
    };

    const fechaSesion = localStorage.getItem('bma_fechaSesion') || obtenerFechaLocal();
    let movimientosCajaList = obtenerDatosBma('bma_caja_chica', []);
    let saldoInicialData = obtenerDatosBma('bma_saldo_inicial_data', {});

    window.habilitarEdicionSaldo = function() {
      const bloque = document.getElementById('cajaBloqueSaldoInicial');
      if (!bloque) return;
      bloque.innerHTML = `
        <label>Saldo Inicial de hoy ($):</label>
        <div style="display: flex; gap: 8px;">
          <input type="number" id="cajaInputSaldo" placeholder="Ej: 5000" style="margin-top:0;" step="any">
          <button class="caja-btn-main" style="margin-top:0; width: auto; padding: 0 16px;" onclick="window.guardarSaldoInicial()">OK</button>
        </div>
      `;
    };

    window.guardarSaldoInicial = function() {
      const input = document.getElementById('cajaInputSaldo');
      const val = parseFloat(input ? input.value : 0);
      if (isNaN(val)) return alert('Ingresá un número válido.');
      saldoInicialData[fechaSesion] = val;
      guardarDatosBma('bma_saldo_inicial_data', saldoInicialData);
      window.renderizarCajaChica();
    };

    window.agregarMovimientoCaja = function() {
      const tipoElem = document.getElementById('cajaTipo');
      const concElem = document.getElementById('cajaConcepto');
      const montElem = document.getElementById('cajaMonto');

      const tipo = tipoElem ? tipoElem.value : 'Ingreso';
      const concepto = concElem ? concElem.value.trim() : '';
      const monto = parseFloat(montElem ? montElem.value : 0) || 0;

      if (!concepto || monto <= 0) return alert('Por favor completá el concepto y un monto válido.');
      
      movimientosCajaList.unshift({ id: Date.now(), fecha: fechaSesion, tipo, concepto, monto });
      guardarDatosBma('bma_caja_chica', movimientosCajaList);
      
      if (concElem) concElem.value = '';
      if (montElem) montElem.value = '';
      
      window.renderizarCajaChica();
    };

    window.eliminarMovimientoCaja = function(id) {
      if (confirm('¿Querés eliminar este movimiento?')) {
        movimientosCajaList = movimientosCajaList.filter(m => m.id !== id);
        guardarDatosBma('bma_caja_chica', movimientosCajaList);
        window.renderizarCajaChica();
        window.renderizarMovimientosModal();
      }
    };

    window.renderizarCajaChica = function() {
      const lblFecha = document.getElementById('lblFechaTrabajoCaja');
      if (lblFecha) {
        const partes = fechaSesion.split('-');
        const fechaFmt = partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : fechaSesion;
        lblFecha.innerText = `Fecha: ${fechaFmt}`;
      }
      
      const saldoIni = saldoInicialData[fechaSesion] !== undefined ? saldoInicialData[fechaSesion] : null;
      const bloqueSaldo = document.getElementById('cajaBloqueSaldoInicial');
      
      if (bloqueSaldo) {
        if (saldoIni !== null) {
          bloqueSaldo.innerHTML = `
            <p style="font-size:0.85rem; text-align:center; margin:2px 0; color:#1e293b;">
               Saldo inicial fijado: <strong>$${formatearMoneda(saldoIni)}</strong> 
               <button onclick="window.habilitarEdicionSaldo()" style="background:none; border:none; color:#3b82f6; text-decoration:underline; cursor:pointer; font-size:0.8rem; font-weight:700; margin-left:6px;">Editar</button>
            </p>`;
        } else {
          window.habilitarEdicionSaldo();
        }
      }

      const movimientosJornada = movimientosCajaList.filter(m => m.fecha === fechaSesion);
      let saldoCalculado = saldoIni || 0;
      movimientosJornada.forEach(m => {
        saldoCalculado += (m.tipo === 'Ingreso' ? m.monto : -m.monto);
      });

      const elemSaldo = document.getElementById('cajaSaldoActual');
      if (elemSaldo) elemSaldo.innerText = `$${formatearMoneda(saldoCalculado)}`;
    };

    window.abrirModalMovimientos = function() {
      window.renderizarMovimientosModal();
      const modal = document.getElementById('modalMovimientosCaja');
      if (modal) modal.style.display = 'flex';
    };

    window.cerrarModalMovimientos = function() {
      const modal = document.getElementById('modalMovimientosCaja');
      if (modal) modal.style.display = 'none';
    };

    window.renderizarMovimientosModal = function() {
      const listaContainer = document.getElementById('listaMovimientosCajaModal');
      if (!listaContainer) return;

      const movimientosJornada = movimientosCajaList.filter(m => m.fecha === fechaSesion);
      let html = '';

      movimientosJornada.forEach(m => {
        html += `
          <div class="caja-mov-item">
            <div>
              <strong style="font-size:0.85rem; color:#0f172a;">${m.concepto}</strong><br>
              <small style="color:#64748b;">${m.tipo}</small>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-weight:700; color:${m.tipo === 'Ingreso' ? '#16a34a' : '#dc2626'}">
                ${m.tipo === 'Ingreso' ? '+' : '-'}$${formatearMoneda(m.monto)}
              </span>
              <button class="caja-btn-del" onclick="window.eliminarMovimientoCaja(${m.id})">✕</button>
            </div>
          </div>`;
      });

      listaContainer.innerHTML = html || '<p style="text-align:center; color:#94a3b8; font-size:0.85rem; margin-top: 20px;">Sin movimientos hoy.</p>';
    };

    // Render inicial
    window.renderizarCajaChica();
  })();
</script>
