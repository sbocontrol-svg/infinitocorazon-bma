<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinito Corazón - Cierre de Jornada</title>
  
  <style>
    :root {
      --primary-color: #000000;
    }
    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    }
    
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      padding: 10px; 
      overflow: hidden;
    }
    
    .container { 
      background-color: #ffffff; 
      color: #1e293b;
      width: 100%; 
      max-width: 370px; 
      padding: 20px 14px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      border: 1px solid #e2e8f0;
      position: relative;
      text-align: center;
    }

    .top-content { 
      text-align: center; 
      width: 100%;
    }
    
    .brand-logo { 
      width: 100%; 
      max-height: 110px; 
      object-fit: contain; 
      margin-bottom: -10px; 
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    
    .brand-name { 
      font-size: 1.65rem; 
      font-weight: 800; 
      color: #d9381e; 
      margin: 0; 
      font-family: 'Segoe script', cursive, sans-serif; 
      line-height: 1.2;
    }
    
    .brand-slogan { 
      font-size: 0.95rem; 
      color: #4b5563; 
      margin-top: -5px; 
      margin-bottom: 0; 
      font-weight: 600; 
      letter-spacing: 0.5px; 
      font-family: 'Segoe script', cursive, sans-serif; 
    }

    .divider {
      border: 0;
      border-top: 1.5px solid #000000;
      margin: 8px 0;
      opacity: 0.85;
      width: 100%;
    }

    .date-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0;
      background: #f8fafc;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1.5px solid #94a3b8;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
      width: 100%;
    }

    .date-label {
      font-size: 0.80rem;
      font-weight: 700;
      color: #4b5563;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .date-formatted-display {
      font-size: 0.80rem;
      font-weight: 800;
      color: var(--primary-color);
      text-align: right;
    }

    .client-display-section {
      text-align: center;
      margin: 4px 0;
      background: #f8fafc;
      padding: 6px;
      border-radius: 8px;
      border: 1px dashed #cbd5e1;
      width: 100%;
    }

    .client-box-label {
      font-size: 0.80rem;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 1px;
      letter-spacing: 0.5px;
    }

    .client-box-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary-color);
      font-family: 'Segoe script', cursive, sans-serif;
    }

    /* Ruedita de Carga (Spinner) en Gris Plata */
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f1f5f9;
      border-top: 4px solid #cbd5e1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 12px auto 8px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Marquesina Móvil de Derecha a Izquierda */
    .marquee-container {
      width: 100%;
      overflow: hidden;
      background: #f8fafc;
      border-radius: 8px;
      padding: 8px 0;
      margin: 6px 0;
      border: 1px solid #cbd5e1;
    }

    .marquee-text {
      display: inline-block;
      white-space: nowrap;
      color: #d9381e;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      animation: marquee 5s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .bottom-actions {
      margin-top: 6px;
      width: 100%;
    }

    .btn-ingresar { 
      background: var(--primary-color); 
      color: white; 
      border: none; 
      padding: 8px; 
      width: 100%; 
      border-radius: 8px; 
      font-weight: 600; 
      font-size: 0.80rem; 
      cursor: pointer; 
      box-shadow: 0 3px 8px rgba(0,0,0,0.3); 
    }
    .btn-ingresar:active { 
      transform: scale(0.98); 
    }
    .btn-ingresar:hover {
      background: #333333;
    }

    .footer-zocalo {
      margin-top: 10px;
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.3;
      font-weight: 600;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-content">
      <img id="lblLogoEmpresa" src="logobma.jpg" alt="Logo" class="brand-logo">
      <h1 class="brand-name" id="lblNombreEmpresa">Infinito Corazón</h1>
      <div class="brand-slogan" id="lblEsloganEmpresa">by Bijou Macramé Artesanal</div>
    </div>
    
    <hr class="divider">

    <div class="date-section">
      <label class="date-label">📅 FECHA:</label>
      <div id="lblFechaFormateada" class="date-formatted-display">--</div>
    </div>

    <hr class="divider">

    <div class="client-display-section">
      <div class="client-box-label">¡Hasta luego!</div>
      <div class="client-box-name" id="lblNombreCliente">Juan Ma</div>
    </div>

    <!-- Spinner de carga -->
    <div class="spinner"></div>

    <!-- Marquesina móvil de derecha a izquierda -->
    <div class="marquee-container">
      <div class="marquee-text">Preparando interfase para la nueva jornada...</div>
    </div>

    <div class="bottom-actions">
      <button class="btn-ingresar" onclick="cerrarAplicacion()">Salir ahora</button>
    </div>

    <div class="footer-zocalo">
      S. B. O Control™ © 2026<br>
      Todos los derechos reservados
    </div>
  </div>

  <script>
    function formatearFechaEntera(fechaStr) {
      if (!fechaStr) return '';
      const partes = fechaStr.split('-');
      if (partes.length !== 3) return fechaStr;
      const anio = partes[0];
      const mesIndex = parseInt(partes[1], 10) - 1;
      const dia = parseInt(partes[2], 10);
      const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      if (mesIndex < 0 || mesIndex > 11) return fechaStr;
      return `${dia} ${meses[mesIndex]} ${anio}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const ahora = new Date();
      const anio = ahora.getFullYear();
      const mes = String(ahora.getMonth() + 1).padStart(2, '0');
      const dia = String(ahora.getDate()).padStart(2, '0');
      const fechaActual = `${anio}-${mes}-${dia}`;

      document.getElementById('lblFechaFormateada').textContent = formatearFechaEntera(fechaActual);

      // Cierra la aplicación automáticamente tras 5 segundos
      setTimeout(() => {
        cerrarAplicacion();
      }, 5000);
    });

    function cerrarAplicacion() {
      // Intenta cerrar la pestaña/ventana del navegador
      window.close();
      
      // Resguardo: Si el navegador bloquea 'window.close()', redirige a una pantalla en blanco limpia
      setTimeout(() => {
        document.body.innerHTML = '<div style="color: #ffffff; text-align: center; font-family: sans-serif; padding-top: 40vh;"><h2>Jornada finalizada.</h2><p>Ya podés cerrar esta pestaña o app.</p></div>';
      }, 300);
    }
  </script>
</body>
</html>
