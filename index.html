<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="icono.png">
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000" id="themeColorMeta">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinito Corazón</title>
  
  <style>
    :root {
      --primary-color: #000000;
    }
    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    }
    
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      padding: 10px; 
    }
    
    .container { 
      background-color: #ffffff; 
      color: #1e293b;
      width: 100%; 
      max-width: 370px; 
      padding: 14px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border: 1px solid #e2e8f0;
      position: relative;
    }

    .top-content { 
      text-align: center; 
    }
    
    .brand-logo { 
      width: 100%; 
      max-height: 110px; 
      object-fit: contain; 
      margin-bottom: -10px; 
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    
    .brand-name { 
      font-size: 1.65rem; 
      font-weight: 800; 
      color: #d9381e; 
      margin: 0; 
      font-family: 'Segoe script', cursive, sans-serif; 
      line-height: 1.2;
    }
    
    .brand-slogan { 
      font-size: 0.95rem; 
      color: #4b5563; 
      margin-top: -5px; 
      margin-bottom: 0; 
      font-weight: 600; 
      letter-spacing: 0.5px; 
      font-family: 'Segoe script', cursive, sans-serif; 
    }

    .divider {
      border: 0;
      border-top: 1.5px solid #000000;
      margin: 4px 0;
      opacity: 0.85;
    }

    .date-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0;
      background: #f8fafc;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1.5px solid #94a3b8;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
    }

    .date-label {
      font-size: 0.80rem;
      font-weight: 700;
      color: #4b5563;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .date-formatted-display {
      font-size: 0.80rem;
      font-weight: 800;
      color: var(--primary-color);
      text-align: right;
    }

    .client-display-section {
      text-align: center;
      margin: 4px 0;
      background: #f8fafc;
      padding: 6px;
      border-radius: 8px;
      border: 1px dashed #cbd5e1;
    }

    .client-box-label {
      font-size: 0.80rem;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 1px;
      letter-spacing: 0.5px;
    }

    .client-box-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary-color);
      font-family: 'Segoe script', cursive, sans-serif;
    }

    .login-section {
      text-align: left;
      margin: 4px 0;
    }

    .section-title {
      font-size: 0.80rem;
      font-weight: 700;
      color: #000000;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .form-group {
      margin-bottom: 6px;
    }

    .form-group label {
      display: block;
      font-size: 0.80rem;
      font-weight: 700;
      color: #4b5563;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.80rem;
      color: #1e293b;
      background-color: #f8fafc;
    }

    .input-uppercase {
      text-transform: uppercase;
      text-align: center;
      font-weight: bold;
    }

    .bottom-actions {
      margin-top: 10px;
    }

    .btn-ingresar { 
      background: var(--primary-color); 
      color: white; 
      border: none; 
      padding: 10px; 
      width: 100%; 
      border-radius: 8px; 
      font-weight: 600; 
      font-size: 0.85rem; 
      cursor: pointer; 
      box-shadow: 0 3px 8px rgba(0,0,0,0.3); 
    }
    .btn-ingresar:active { 
      transform: scale(0.98); 
    }
    .btn-ingresar:hover {
      background: #333333;
    }

    .footer-zocalo {
      margin-top: 8px;
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.3;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-content">
      <img id="lblLogoEmpresa" src="logobma.jpg" alt="Logo" class="brand-logo">
      <h1 class="brand-name" id="lblNombreEmpresa">Infinito Corazón</h1>
      <div class="brand-slogan" id="lblEsloganEmpresa">by Bijou Macramé Artesanal</div>
    </div>
    
    <hr class="divider">

    <div class="date-section">
      <label class="date-label">📅 FECHA:</label>
      <div id="lblFechaFormateada" class="date-formatted-display">--</div>
    </div>

    <hr class="divider">

    <div class="client-display-section">
      <div class="client-box-label">¡Bienvenido!</div>
      <div class="client-box-name">JuanMa</div>
    </div>

    <hr class="divider">

    <div class="login-section">
      <div class="section-title">Ingresar al Sistema</div>
      
      <div class="form-group">
        <label for="txtLicenciaNombre">Licencia:</label>
        <input type="text" id="txtLicenciaNombre" class="form-control" value="Licencia Vitalicia de por Vida" disabled style="background-color: #f1f5f9; font-weight: bold; text-align: center; color: #000000;">
      </div>

      <div class="form-group">
        <label for="txtClave">Clave de Acceso:</label>
        <input type="text" id="txtClave" class="form-control input-uppercase" placeholder="SBO-LVDPV">
      </div>
    </div>

    <div class="bottom-actions">
      <button class="btn-ingresar" onclick="entrarAlSistema()">Comenzar</button>
    </div>

    <div class="footer-zocalo">
      S. B. O Control™ © 2026<br>
      Todos los derechos reservados
    </div>
  </div>

  <script>
    let fechaActualSistema = '';

    function formatearFechaEntera(fechaStr) {
      if (!fechaStr) return '';
      const partes = fechaStr.split('-');
      if (partes.length !== 3) return fechaStr;
      const anio = partes[0];
      const mesIndex = parseInt(partes[1], 10) - 1;
      const dia = parseInt(partes[2], 10);
      const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      if (mesIndex < 0 || mesIndex > 11) return fechaStr;
      return `${dia} ${meses[mesIndex]} ${anio}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const ahora = new Date();
      const anio = ahora.getFullYear();
      const mes = String(ahora.getMonth() + 1).padStart(2, '0');
      const dia = String(ahora.getDate()).padStart(2, '0');
      fechaActualSistema = `${anio}-${mes}-${dia}`;

      document.getElementById('lblFechaFormateada').textContent = formatearFechaEntera(fechaActualSistema);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log("Service Worker registrado con éxito."))
          .catch(err => console.log("Fallo al registrar el Service Worker:", err));
      }
    });

    function entrarAlSistema() {
      const clave = document.getElementById('txtClave').value.trim();

      if (clave !== 'SBO-LVDPV') {
        alert('La clave de acceso es incorrecta. Debe ser SBO-LVDPV.');
        return;
      }

      const fechaFormateadaTexto = formatearFechaEntera(fechaActualSistema);

      localStorage.setItem('bma_fechaSesion', fechaActualSistema);
      localStorage.setItem('sbo_fechaSesion', fechaActualSistema);
      localStorage.setItem('bma_fechaSesionTexto', fechaFormateadaTexto);
      localStorage.setItem('bma_licenciaNombre', 'Licencia Vitalicia de por Vida');
      localStorage.setItem('bma_clave', clave);
      localStorage.setItem('bma_nombre', 'JuanMa');

      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
