<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinito Corazón - Bienvenida</title>

  <!-- PWA y Favicons -->
  <link rel="icon" type="image/png" href="icono.png">
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b1329">
  
  <style>
    :root {
      --primary-color: #0b1329;
      --accent-color: #d9381e;
      --silver-color: #94a3b8; /* Gris plata */
    }
    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    }
    
    body { 
      background-color: #0b1329; 
      color: #f8fafc; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      padding: 12px; 
      overflow: hidden;
    }
    
    .container { 
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      color: #1e293b;
      width: 100%; 
      max-width: 380px; 
      padding: 24px 18px; 
      border-radius: 20px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    .top-content { width: 100%; }
    
    .brand-logo { 
      width: 85px; 
      height: 85px; 
      object-fit: cover; 
      border-radius: 16px;
      margin: 0 auto 10px auto; 
      display: block;
      border: 1px solid #cbd5e1;
    }
    
    .brand-name { 
      font-size: 1.75rem; 
      font-weight: 800; 
      color: var(--accent-color); 
      margin: 0; 
      font-family: 'Segoe script', cursive, sans-serif; 
      line-height: 1.1;
    }
    
    .brand-slogan { 
      font-size: 0.9rem; 
      color: #4b5563; 
      margin-top: 2px; 
      font-weight: 600; 
      font-family: 'Segoe script', cursive, sans-serif; 
    }

    .divider {
      border: 0;
      border-top: 1.5px solid #e2e8f0;
      margin: 12px 0;
      width: 100%;
    }

    .date-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      width: 100%;
    }

    .date-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: #475569;
      text-transform: uppercase;
    }

    .date-formatted-display {
      font-size: 0.80rem;
      font-weight: 800;
      color: var(--primary-color);
      text-align: right;
    }

    .welcome-box {
      margin-top: 10px;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      width: 100%;
    }

    .welcome-label {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 700;
    }

    .welcome-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary-color);
      font-family: 'Segoe script', cursive, sans-serif;
    }

    /* Spinner en Gris Plata */
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #f1f5f9;
      border-top: 4px solid var(--silver-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 14px auto 10px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Marquesina Móvil de Derecha a Izquierda (Ancho Total) */
    .marquee-container {
      width: 100%;
      overflow: hidden;
      background: #f8fafc;
      border-radius: 8px;
      padding: 8px 0;
      margin: 8px 0 12px 0;
      border: 1px solid #cbd5e1;
    }

    .marquee-text {
      display: inline-block;
      white-space: nowrap;
      color: var(--accent-color);
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.5px;
      animation: marquee 5s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .bottom-actions { width: 100%; }

    .btn-ingresar { 
      background: var(--primary-color); 
      color: white; 
      border: none; 
      padding: 10px; 
      width: 100%; 
      border-radius: 10px; 
      font-weight: 700; 
      font-size: 0.85rem; 
      cursor: pointer; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
    }
    .btn-ingresar:active { transform: scale(0.98); }

    .footer-zocalo {
      margin-top: 14px;
      text-align: center;
      font-size: 0.72rem;
      color: #64748b;
      font-weight: 600;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-content">
      <img src="icono.png" alt="Logo BMA" class="brand-logo">
      <h1 class="brand-name">Infinito Corazón</h1>
      <div class="brand-slogan">by Bijou Macramé</div>
    </div>
    
    <hr class="divider">

    <div class="date-section">
      <span class="date-label">📅 FECHA:</span>
      <span id="lblFechaFormateada" class="date-formatted-display">--</span>
    </div>

    <div class="welcome-box">
      <div class="welcome-label">¡Bienvenido!</div>
      <div class="welcome-name">Juan Ma</div>
    </div>

    <!-- Spinner Gris Plata -->
    <div class="spinner"></div>

    <!-- Marquesina móvil de derecha a izquierda -->
    <div class="marquee-container">
      <div class="marquee-text">Preparando el entorno para comenzar la jornada...</div>
    </div>

    <div class="bottom-actions">
      <button class="btn-ingresar" onclick="entrarAlSistema()">Entrar ahora</button>
    </div>

    <div class="footer-zocalo">
      Infinito Corazón® 2026<br>
      Todos los derechos reservados
    </div>
  </div>

  <script>
    let fechaActualSistema = '';

    function formatearFechaEntera(fechaStr) {
      if (!fechaStr) return '';
      const partes = fechaStr.split('-');
      if (partes.length !== 3) return fechaStr;
      const anio = partes[0];
      const mesIndex = parseInt(partes[1], 10) - 1;
      const dia = parseInt(partes[2], 10);
      const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      return `${dia} de ${meses[mesIndex] || ''} de ${anio}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const ahora = new Date();
      const anio = ahora.getFullYear();
      const mes = String(ahora.getMonth() + 1).padStart(2, '0');
      const dia = String(ahora.getDate()).padStart(2, '0');
      fechaActualSistema = `${anio}-${mes}-${dia}`;

      document.getElementById('lblFechaFormateada').textContent = formatearFechaEntera(fechaActualSistema);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
      }

      // Temporizador de 5 segundos para redirigir al menú
      setTimeout(() => {
        entrarAlSistema();
      }, 5000);
    });

    function entrarAlSistema() {
      const fechaTexto = document.getElementById('lblFechaFormateada').textContent;

      localStorage.setItem('bma_fechaSesion', fechaActualSistema);
      localStorage.setItem('bma_fechaSesionTexto', fechaTexto);
      localStorage.setItem('bma_nombre', 'Juan Ma');

      window.location.href = 'menu.html';
    }
  </script>
</body>
</html>
